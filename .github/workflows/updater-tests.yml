name: Updater tests

on:
  push:
    branches:
      - feature/standalone-updater
  pull_request:
    paths:
      - "updater/**"
      - "tests/test_*.py"
      - ".github/workflows/updater-tests.yml"

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install updater build and test dependencies
        run: python -m pip install "cryptography>=44,<47" "PyInstaller==6.22.2"
      - name: Run updater unit tests
        run: |
          python -m unittest discover -s tests -p "test_updater.py" -v
          python -m unittest discover -s tests -p "test_patch_builder.py" -v
          python -m unittest discover -s tests -p "test_manifest_hardening.py" -v
          python -m unittest discover -s tests -p "test_updater_signatures.py" -v
      - name: Build standalone Updater.exe
        run: |
          cmd /c scripts\build_updater.bat
          if (!(Test-Path "dist/Updater/Updater.exe")) { throw "Updater.exe was not produced." }
